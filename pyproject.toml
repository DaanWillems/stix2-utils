[build-system]
requires = ["uv_build >= 0.11.23, <0.12.0"]
build-backend = "uv_build"

[project]
name = "stix2-utils"
version = "0.0.3"
requires-python = ">= 3.13"
description = "Utility library for validating stix2 entities and patterns"
readme = "README.md"
authors = [
    { name = "Daan Willems", email = "daan@daan.nl" }
]
dependencies = [
    "pydantic"
]
[project.optional-dependencies]
dev = [
    "pytest"
]
[project.scripts]
replicator = "taxii_replicator.__main__:main"

[tool.uv.build-backend]
module-root = ""
module-name = "stix2utils"

[tool.setuptools.packages]
find = { }

[tool.pytest.ini_options]
pythonpath = "."

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[tool.ruff]
exclude = [
]
line-length = 140
indent-width = 4

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint.per-file-ignores]
"tests/fixtures/**.py" = ["PT022"]  # Inversed teardown, ignore for this specific case only
"tests/*" = [
    "ANN",      # Non annotations are fine in tests.
    "S101",     # We actually want 'assert' in tests.
    "S106",     # Dummy strings as passswords are fine in tests.
]


[tool.ruff.lint]
ignore = ["ANN002", "ANN003", "FIX002", "COM812", "UP040"]
select = ["E", "F", "W", "ANN", "I", "N", "UP", "YTT", "S", "BLE", "FBT", "B", "A", "COM", "C4", "T10", "EM", "EXE", "ISC", "ICN", "LOG", "G", "INP", "PIE", "T20", "PYI", "PT", "RSE", "RET", "SLF", "SIM", "TID", "TCH", "INT", "ARG", "PTH", "TD", "FIX", "ERA", "R", "TRY", "FLY", "PERF", "FURB", "RUF"]

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["pydantic.BaseModel"]